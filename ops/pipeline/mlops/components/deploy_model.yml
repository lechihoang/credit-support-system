$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: mlops_deploy_model
display_name: MLOps Deploy Model
version: 1
code: ../../../../
environment: azureml:mlops-env@latest
identity:
  type: managed_identity
inputs:
  endpoint_name:
    type: string
  deployment_name:
    type: string
  model_name:
    type: string
  version_file:
    type: uri_file
  instance_type:
    type: string
    default: Standard_DS1_v2
  instance_count:
    type: integer
    default: 1
  inference_env:
    type: string
    default: mlops-env@latest
  scoring_script:
    type: string
    default: score.py
outputs:
  done_file:
    type: uri_file
command: >-
  python steps/mlops/step_deploy_model.py
  --endpoint-name ${{inputs.endpoint_name}}
  --deployment-name ${{inputs.deployment_name}}
  --model-name ${{inputs.model_name}}
  --model-version-file ${{inputs.version_file}}
  --instance-type ${{inputs.instance_type}}
  --instance-count ${{inputs.instance_count}}
  --inference-env ${{inputs.inference_env}}
  --scoring-script ${{inputs.scoring_script}}
  && echo done > ${{outputs.done_file}}
